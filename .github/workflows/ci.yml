name: CI Pipeline

on: [push]

jobs: 
    build-test:
        runs-on: ubuntu-latest

        steps: 
         - name: Checkout Code
           uses: actions/checkout@v4

         - name: Setup python
           uses: actions/setup-python@v4
           with: 
            python-version: "3.10"
        
         - name: Install Dependicies
           run: pip install -r requirements.txt

         - name: Run Tests
           run: python -m pytest
